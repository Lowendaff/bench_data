# Keeps the generated lists in servers/ current: iperf3 servers (servers/iperf3.json), China
# carrier speed nodes (servers/taier.json), and Netflix IX peering ports (servers/netflix-ix.json).
# Runs every four hours, manually, or when candidates/scripts change on main. Each source updates
# independently so a temporary outage of one upstream feed does not block the others.
name: data

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - servers/iperf3-candidates.json
      - scripts/iperf3-servers.sh
      - scripts/taier-collect.py
      - scripts/taier-servers.sh
      - scripts/netflix-ix.sh
      - scripts/list-rules.jq
      - .github/workflows/data.yml

permissions: {}

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    name: update generated server lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # commits refreshed server lists to main
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update lists from upstream exports
        run: |
          update_one() {
            local name=$1 file=$2 script=$3 url=$4 limit=$5
            local src="$RUNNER_TEMP/$name.json"
            local log="$RUNNER_TEMP/$name.txt"
            if ! curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --max-time 120 --retry 3 --max-filesize "$limit" \
              --output "$src" "$url"; then
              echo "::warning::failed to fetch upstream source for $name"
              return 0
            fi
            if ! "$script" update "$src" > "$log"; then
              echo "::warning::update check rejected upstream source for $name"
              return 0
            fi
            "$script" check
            {
              echo "### $name (\`$file\`)"
              echo
              sed 's/^/- /' "$log"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          update_one "iperf3" "servers/iperf3.json" "scripts/iperf3-servers.sh" \
            "https://export.iperf3serverlist.net/listed_iperf3_servers.json" 2097152
          if python3 scripts/taier-collect.py \
            --pool servers/taier-pool.json \
            --ipv6-out servers/taier-ipv6.json \
            --export-out "$RUNNER_TEMP/taier-export.json" > "$RUNNER_TEMP/taier-collect.txt"; then
            if scripts/taier-servers.sh update "$RUNNER_TEMP/taier-export.json" \
              > "$RUNNER_TEMP/taier.txt"; then
              scripts/taier-servers.sh check
              {
                echo "### taier (\`servers/taier.json\`)"
                echo
                sed 's/^/- /' "$RUNNER_TEMP/taier-collect.txt"
                sed 's/^/- /' "$RUNNER_TEMP/taier.txt"
                echo
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::taier-servers.sh rejected collected export"
            fi
          else
            echo "::warning::taier-collect.py failed to collect upstream nodes"
          fi
          update_one "netflix-ix" "servers/netflix-ix.json" "scripts/netflix-ix.sh" \
            "https://www.peeringdb.com/api/netixlan?net_id=457" 1048576
      - name: Commit and push updated lists
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published=(
            servers/iperf3.json
            servers/taier.json
            servers/taier-ipv6.json
            servers/netflix-ix.json
          )
          pool_membership_changed=true
          if [ -f servers/taier-pool.json ] &&
            git cat-file -e HEAD:servers/taier-pool.json 2>/dev/null; then
            git show HEAD:servers/taier-pool.json |
              jq -c '[.nodes[] | {ip, port, p, c, o}] | sort_by(.ip, .port)' \
              > "$RUNNER_TEMP/pool-before.json"
            jq -c '[.nodes[] | {ip, port, p, c, o}] | sort_by(.ip, .port)' \
              servers/taier-pool.json > "$RUNNER_TEMP/pool-after.json"
            if cmp -s "$RUNNER_TEMP/pool-before.json" "$RUNNER_TEMP/pool-after.json"; then
              pool_membership_changed=false
            fi
          fi
          if git diff --quiet -- "${published[@]}" && [ "$pool_membership_changed" = false ]; then
            echo "All published server lists and pool endpoints are current."
            printf 'pushed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          taier_changed=true
          if git diff --quiet -- servers/taier.json; then
            taier_changed=false
          fi

          git add "${published[@]}" servers/taier-pool.json
          if git diff --cached --quiet; then
            echo "All generated lists are current."
            printf 'pushed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "build: refresh generated server lists"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="$auth" git push --quiet origin HEAD:refs/heads/main; then
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="$auth" git pull --quiet --rebase origin main
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="$auth" git push --quiet origin HEAD:refs/heads/main
          fi
          head_sha=$(git rev-parse HEAD)
          printf 'pushed=true\ntaier_changed=%s\nsha=%s\n' \
            "$taier_changed" "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Notify lowendaff_bench on Taier list updates
        if: steps.push.outputs.pushed == 'true' && steps.push.outputs.taier_changed == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "BENCH_DISPATCH_TOKEN is not set; relying on scheduled sync in lowendaff_bench."
            exit 0
          fi
          payload=$(jq -n -c --arg sha "$PUSHED_SHA" \
            '{event_type: "bench-data-updated", client_payload: {sha: $sha}}')
          if ! curl --fail --silent --show-error \
            --proto '=https' --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Lowendaff/lowendaff_bench/dispatches \
            -d "$payload"; then
            echo "::warning::repository_dispatch to Lowendaff/lowendaff_bench failed"
          else
            echo "Dispatched bench-data-updated ($PUSHED_SHA) to Lowendaff/lowendaff_bench."
          fi
