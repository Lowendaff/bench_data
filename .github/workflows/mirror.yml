# Copies the build images in scripts/distros.txt to ghcr.io/lowendaff/bench_data under their
# digests. Packages published with GITHUB_TOKEN are linked to this repository, so tools.yml pulls
# them with its own token without external registry rate limits.
name: mirror

on:
  workflow_dispatch:

permissions: {}

jobs:
  mirror:
    name: copy build images to ghcr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # publishes mirrored build images to ghcr.io/lowendaff/bench_data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install crane
        env:
          VERSION: v0.22.1
          ASSET: go-containerregistry_Linux_x86_64.tar.gz
          SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/$VERSION/$ASSET"
          echo "$SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/crane"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane" crane
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Copy
        run: scripts/mirror.sh ghcr.io/lowendaff/bench_data
